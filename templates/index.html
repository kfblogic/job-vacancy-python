<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lowongan Kerja Terkini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #f0f4f8, #e2ebf0);
            padding: 2rem;
        }
        .job-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            padding: 1.2rem;
            transition: all 0.3s ease;
            height: 100%;
        }
        .job-card:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        }
        .job-logo {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 10px;
            background: #f9f9f9;
            margin-right: 1rem;
        }
        .badge-sumber {
            font-size: 0.75rem;
            background-color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="mb-4 fw-bold text-primary">Cari Lowongan Kerja Terbaru 🔍</h2>
        <form id="searchForm" class="row gy-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Posisi</label>
                <input type="text" class="form-control" name="work" placeholder="Contoh: Programmer" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Sumber</label>
                <select name="source" class="form-select" id="sourceSelect" required>
                    <option value="">Pilih Situs</option>
                    <option value="all">Semua Situs</option>
                    <option value="glints">Glints</option>
                    <option value="jobstreet">Jobstreet</option>
                    <option value="karir">Karir</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Jenis Pekerjaan</label>
                <select name="job_type" class="form-select" id="jobTypeSelect" disabled>
                    <option value="">Tipe Kerja</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Tipe Lokasi</label>
                <select name="work_option" class="form-select" id="workOptionSelect" disabled>
                    <option value="">Opsi Kerja</option>
                    <option value="onsite">Onsite</option>
                    <option value="hybird">Hybrid</option>
                    <option value="remote">Remote</option>
                </select>
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-primary">🔎 Cari</button>
            </div>
        </form>

        <hr class="my-4">
        <div id="results" class="row g-4"></div>
        <nav id="paginationContainer" class="d-flex justify-content-center mt-4" aria-label="Pagination" style="display: none;">
            <ul class="pagination" id="pagination"></ul>
        </nav>

    </div>

    <script>
        const form = document.getElementById("searchForm");
        const resultsDiv = document.getElementById("results");
        const paginationContainer = document.getElementById("paginationContainer");
        const paginationUl = document.getElementById("pagination");

        let currentPage = 1;
        let lastPage = 1;

        const PAGE_SIZE_ALL = 24;
        let ALL_RESULTS_CACHE = [];

        sourceSelect.addEventListener("change", function () {
            const source = this.value;

            jobTypeSelect.innerHTML = "";
            const combinedTypes = {
                "": "Tipe Kerja",
                fulltime: "Fulltime",
                kontrak: "Kontrak",
                magang: "Magang",
                parttime: "Part-time",
                freelance: "Freelance"
            };

            if (["glints", "jobstreet", "all"].includes(source)) {
                for (let key in combinedTypes) {
                    const opt = document.createElement("option");
                    opt.value = key;
                    opt.textContent = combinedTypes[key];
                    jobTypeSelect.appendChild(opt);
                }
                jobTypeSelect.disabled = false;
            } else {
                jobTypeSelect.disabled = true;
            }

            workOptionSelect.disabled = source === "";
        });

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            currentPage = 1;
            fetchJobs(currentPage);
        });

        function buildSinglePagination(current, total, onChange) {
            paginationUl.innerHTML = "";
            paginationContainer.style.display = (total > 1) ? "block" : "none";

            // Prev
            const prev = document.createElement("li");
            prev.className = `page-item ${current === 1 ? "disabled" : ""}`;
            prev.innerHTML = `<a class="page-link" href="#">←</a>`;
            prev.onclick = (ev) => { ev.preventDefault(); if (current > 1) onChange(current - 1); };
            paginationUl.appendChild(prev);

            const cur = document.createElement("li");
            cur.className = `page-item disabled`;
            cur.innerHTML = `<span class="page-link">${current} / ${total}</span>`;
            paginationUl.appendChild(cur);

            // Next
            const next = document.createElement("li");
            next.className = `page-item ${current === total ? "disabled" : ""}`;
            next.innerHTML = `<a class="page-link" href="#">→</a>`;
            next.onclick = (ev) => { ev.preventDefault(); if (current < total) onChange(current + 1); };
            paginationUl.appendChild(next);
        }

        function renderJobs(list) {
            resultsDiv.innerHTML = "";
            list.forEach(job => {
                resultsDiv.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="job-card">
                    <div class="d-flex align-items-center mb-2">
                        <img src="${job.company_logo}" class="job-logo me-3" onerror="this.onerror=null; this.src='https://placehold.co/60x60?text=No+Logo'">
                        <div>
                        <h5 class="mb-0">${job.title}</h5>
                        <small class="text-muted">${job.company_name || ''}</small>
                        </div>
                    </div>
                    <p class="mb-1"><strong>Lokasi:</strong> ${job.location || '-'}</p>
                    <p class="mb-1"><strong>Gaji:</strong> ${job.salary || 'Tidak disebutkan'}</p>
                    <p class="mb-2"><span class="badge bg-primary badge-sumber">Sumber: ${job.source || '-'}</span></p>
                    <a href="${job.link}" target="_blank" class="btn btn-sm btn-outline-success w-100">Lihat Detail Pekerjaan</a>
                    </div>
                </div>`;
            });
        }

        async function fetchJobs(page = 1) {
            const work = form.work.value;
            const source = form.source.value;
            const job_type = form.job_type.value;
            const work_option = form.work_option.value;
            const location_id = "all";

            resultsDiv.innerHTML = "<p class='text-center'>⏳ Mengambil data lowongan...</p>";
            paginationContainer.style.display = "none";
            paginationUl.innerHTML = "";

            resultsDiv.querySelectorAll(".pagination").forEach(el => el.remove());
            document.querySelectorAll("ul.pagination").forEach(el => {
                if (el.id !== "pagination") el.remove();
            });

            // === MODE "Semua" -> panggil /all SEKALI ===
            if (source === "all") {
                try {
                    const params = new URLSearchParams({
                        work,
                        job_type,
                        work_option,
                        location_id,
                        page: String(page),
                        per_page: "24"
                    });

                    const res = await fetch(`/all?${params.toString()}`);
                    const json = await res.json();

                    resultsDiv.querySelectorAll(".pagination").forEach(el => el.remove());

                    if (!(json.status && json.data && Array.isArray(json.data.jobs) && json.data.jobs.length)) {
                        resultsDiv.innerHTML = `<p class="text-danger text-center mt-4">❌ Tidak ada lowongan ditemukan.</p>`;
                        return;
                    }

                    // render hasil gabungan
                    resultsDiv.innerHTML = "";
                    json.data.jobs.forEach(job => {
                        resultsDiv.innerHTML += `
                            <div class="col-md-6 col-lg-4">
                            <div class="job-card">
                                <div class="d-flex align-items-center mb-2">
                                <img src="${job.company_logo}" class="job-logo me-3" onerror="this.onerror=null; this.src='https://placehold.co/60x60?text=No+Logo'">
                                <div>
                                    <h5 class="mb-0">${job.title}</h5>
                                    <small class="text-muted">${job.company_name || ''}</small>
                                </div>
                                </div>
                                <p class="mb-1"><strong>Lokasi:</strong> ${job.location || '-'}</p>
                                <p class="mb-1"><strong>Gaji:</strong> ${job.salary || 'Tidak disebutkan'}</p>
                                <p class="mb-2"><span class="badge bg-primary badge-sumber">Sumber: ${job.source || '-'}</span></p>
                                <a href="${job.link}" target="_blank" class="btn btn-sm btn-outline-success w-100">Lihat Detail Pekerjaan</a>
                            </div>
                            </div>`;
                    });

                    // SATU pagination dari server
                    const p = json.data.pagination;
                    if (p && p.last_page && p.last_page > 1) {
                        currentPage = p.current_page || 1;
                        lastPage = p.last_page || 1;

                        paginationUl.innerHTML = "";
                        paginationContainer.style.display = "block";

                        const prev = document.createElement("li");
                        prev.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
                        prev.innerHTML = `<a class="page-link" href="#">←</a>`;
                        prev.onclick = (ev) => { ev.preventDefault(); if (currentPage > 1) fetchJobs(currentPage - 1); };
                        paginationUl.appendChild(prev);

                        const cur = document.createElement("li");
                        cur.className = `page-item disabled`;
                        cur.innerHTML = `<span class="page-link">${currentPage} / ${lastPage}</span>`;
                        paginationUl.appendChild(cur);

                        const next = document.createElement("li");
                        next.className = `page-item ${currentPage === lastPage ? "disabled" : ""}`;
                        next.innerHTML = `<a class="page-link" href="#">→</a>`;
                        next.onclick = (ev) => { ev.preventDefault(); if (currentPage < lastPage) fetchJobs(currentPage + 1); };
                        paginationUl.appendChild(next);
                    } else {
                        paginationContainer.style.display = "none";
                    }
                } catch (e) {
                    resultsDiv.innerHTML = `<p class="text-danger text-center mt-4">❌ Gagal mengambil data /all.</p>`;
                }
                return;
            }

            try {
                let endpoint = `/${source}`;
                const params = new URLSearchParams({ work, page: String(page) });

                if (source !== "karir") {
                    if (job_type) params.append("job_type", job_type);
                    if (work_option) params.append("work_option", work_option);
                } else {
                    if (work_option) params.append("work_option", work_option);
                }

                const res = await fetch(`${endpoint}?${params.toString()}`);
                const json = await res.json();

                if (!(json.status && json.data && Array.isArray(json.data.jobs) && json.data.jobs.length)) {
                    resultsDiv.innerHTML = `<p class="text-danger text-center mt-4">❌ Tidak ada lowongan ditemukan.</p>`;
                    return;
                }

                resultsDiv.innerHTML = "";
                json.data.jobs.forEach(job => {
                    resultsDiv.innerHTML += `
                    <div class="col-md-6 col-lg-4">
                        <div class="job-card">
                        <div class="d-flex align-items-center mb-2">
                            <img src="${job.company_logo}" class="job-logo me-3" onerror="this.onerror=null; this.src='https://placehold.co/60x60?text=No+Logo'">
                            <div>
                            <h5 class="mb-0">${job.title}</h5>
                            <small class="text-muted">${job.company_name || ''}</small>
                            </div>
                        </div>
                        <p class="mb-1"><strong>Lokasi:</strong> ${job.location || '-'}</p>
                        <p class="mb-1"><strong>Gaji:</strong> ${job.salary || 'Tidak disebutkan'}</p>
                        <a href="${job.link}" target="_blank" class="btn btn-sm btn-outline-success w-100">Lihat Detail Pekerjaan</a>
                        </div>
                    </div>`;
                });

                if (json.data.pagination) {
                    const p = json.data.pagination;
                    currentPage = p.current_page || 1;
                    lastPage = p.last_page || 1;

                    paginationUl.innerHTML = "";
                    paginationContainer.style.display = (lastPage > 1) ? "block" : "none";

                    const prev = document.createElement("li");
                    prev.className = `page-item ${currentPage === 1 ? "disabled" : ""}`;
                    prev.innerHTML = `<a class="page-link" href="#">←</a>`;
                    prev.onclick = (ev) => { ev.preventDefault(); if (currentPage > 1) fetchJobs(currentPage - 1); };
                    paginationUl.appendChild(prev);

                    const cur = document.createElement("li");
                    cur.className = `page-item disabled`;
                    cur.innerHTML = `<span class="page-link">${currentPage} / ${lastPage}</span>`;
                    paginationUl.appendChild(cur);

                    const next = document.createElement("li");
                    next.className = `page-item ${currentPage === lastPage ? "disabled" : ""}`;
                    next.innerHTML = `<a class="page-link" href="#">→</a>`;
                    next.onclick = (ev) => { ev.preventDefault(); if (currentPage < lastPage) fetchJobs(currentPage + 1); };
                    paginationUl.appendChild(next);
                } else {
                    paginationContainer.style.display = "none";
                }
            } catch (e) {
                resultsDiv.innerHTML = `<p class="text-danger text-center mt-4">❌ Terjadi kesalahan saat mengambil data.</p>`;
            }
        }
    </script>

</body>
</html>
